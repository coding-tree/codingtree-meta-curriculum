        {tab === "sections" && (
          <>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(250px, 1fr))", gap: 10, marginBottom: 20 }}>
              {SECTIONS.map(sec => (
                <div key={sec.id}
                  onClick={() => { setOpenSec(openSec === sec.id ? null : sec.id); setOpenCon(null); }}
                  style={{
                    background: "#fff",
                    border: openSec === sec.id ? `2px solid ${sec.color}` : "2px solid #e8e4de",
                    borderRadius: 14, padding: "14px 16px", cursor: "pointer",
                    boxShadow: openSec === sec.id ? `0 0 0 3px ${sec.color}22` : "0 1px 4px rgba(0,0,0,0.04)",
                    transition: "all 0.15s",
                  }}>
                  <div style={{ fontSize: 22, marginBottom: 4 }}>{sec.icon}</div>
                  <div style={{ fontSize: 14, fontWeight: 800, color: openSec === sec.id ? sec.color : "#1a1a2e", marginBottom: 3 }}>{sec.title}</div>
                  <div style={{ fontSize: 12, color: "#8a8aa0", lineHeight: 1.4 }}>{sec.desc}</div>
                  <div style={{ fontSize: 11, fontWeight: 600, background: sec.colorDim, color: sec.color, padding: "3px 10px", borderRadius: 20, display: "inline-block", marginTop: 8 }}>
                    {sec.concepts.length} pojec
                  </div>
                </div>
              ))}
            </div>

            {curSec && (
              <div ref={sectionDetailRef} style={{ background: curSec.colorDim, borderRadius: 16, padding: 18, border: `1px solid ${curSec.color}30` }}>
                <h2 style={{ fontSize: 18, fontWeight: 900, marginBottom: 4 }}>{curSec.icon} {curSec.title}</h2>
                <p style={{ fontSize: 12, color: "#5a5a7a", marginBottom: 14 }}>{curSec.desc}</p>

                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {curSec.concepts.map((c, idx) => (
                    <div key={idx}
                      onClick={() => setOpenCon(openCon === idx ? null : idx)}
                      style={{
                        background: "#fff",
                        border: openCon === idx ? `2px solid ${curSec.color}` : "2px solid transparent",
                        borderRadius: 12, padding: "12px 14px", cursor: "pointer",
                        boxShadow: openCon === idx ? `0 0 0 3px ${curSec.color}18` : "none",
                        transition: "all 0.15s",
                      }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                        <span style={{ fontSize: 15, fontWeight: 700 }}>{c.name}</span>
                        <span style={{ fontSize: 16, transition: "transform 0.2s", transform: openCon === idx ? "rotate(180deg)" : "none" }}>&#9662;</span>
                      </div>
                      <div style={{ fontSize: 13, color: "#5a5a7a", marginTop: 4, lineHeight: 1.5 }}>{c.explain}</div>

                      {openCon === idx && (<div ref={conceptDetailRef}>
                        <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 8 }}>
                          {[
                            { bg: "#fff3e0", icon: "\uD83C\uDFAE", label: "Analogia", text: c.analogy },
                            { bg: "#e3f2fd", icon: "\uD83D\uDCBB", label: "W programowaniu", text: c.programming },
                            { bg: "#fce4ec", icon: "\u2753", label: "Pytanie do dzieci", text: c.question },
                            { bg: "#e8f5e9", icon: "\uD83C\uDFAF", label: "Mini zadanie", text: c.task },
                          ].map((d, i) => (
                            <div key={i} style={{ background: d.bg, borderRadius: 10, padding: "11px 13px" }}>
                              <div style={{ fontSize: 10, fontWeight: 800, textTransform: "uppercase", letterSpacing: 1.2, color: "#666", marginBottom: 4 }}>
                                {d.icon} {d.label}
                              </div>
                              <div style={{ fontSize: 13, lineHeight: 1.7, color: "#1a1a2e" }}>{d.text}</div>
                            </div>
                          ))}
                        </div>
                      </div>)}
                    </div>
                  ))}
                </div>
              </div>
            )}
          </>
        )}

        {tab === "games" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            {GAMES.map((g, i) => (
              <div key={i} style={{ background: "#fff", borderRadius: 14, padding: "16px 18px", border: "1px solid #e8e4de" }}>
                <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 8 }}>{g.title}</div>
                <div style={{ display: "flex", gap: 10, marginBottom: 10, flexWrap: "wrap" }}>
                  <span style={{ fontSize: 12, background: "#e3f2fd", padding: "3px 10px", borderRadius: 8 }}>{g.players}</span>
                  <span style={{ fontSize: 12, background: "#fff3e0", padding: "3px 10px", borderRadius: 8 }}>{g.time}</span>
                </div>
                <div style={{ fontSize: 13, color: "#5a5a7a", lineHeight: 1.7, marginBottom: 8 }}>{g.rules}</div>
                <div style={{ fontSize: 12, color: "#8a8aa0" }}>{g.materials}</div>
              </div>
            ))}
          </div>
        )}

        {tab === "project" && (
          <div style={{ background: "#ede7f6", borderRadius: 16, padding: 20, border: "1px solid #6c5ce730" }}>
            <h2 style={{ fontSize: 18, fontWeight: 900, marginBottom: 4 }}>{PROJECT.title}</h2>
            <p style={{ fontSize: 13, color: "#5a5a7a", marginBottom: 16, lineHeight: 1.6 }}>{PROJECT.desc}</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {PROJECT.steps.map((step, i) => (
                <div key={i} style={{ background: "rgba(255,255,255,0.8)", borderRadius: 10, padding: "10px 14px", display: "flex", gap: 12, alignItems: "flex-start" }}>
                  <span style={{ background: "#6c5ce7", color: "#fff", width: 26, height: 26, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 700, flexShrink: 0 }}>{i + 1}</span>
                  <span style={{ fontSize: 14, lineHeight: 1.6 }}>{step}</span>
                </div>
              ))}
            </div>
            <div style={{ marginTop: 16 }}>
              <div style={{ fontSize: 10, fontWeight: 800, textTransform: "uppercase", letterSpacing: 1.5, color: "#8a8aa0", marginBottom: 6 }}>Wykorzystane pojecia</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 5 }}>
                {PROJECT.concepts.map((c, i) => (
                  <span key={i} style={{ fontSize: 12, background: "#d1c4e9", color: "#4a148c", padding: "3px 10px", borderRadius: 8 }}>{c}</span>
                ))}
              </div>
            </div>
          </div>
        )}

        <div style={{ marginTop: 24, background: "#fff", borderRadius: 14, padding: 18, border: "1px solid #e8e4de", textAlign: "center" }}>
          <div style={{ display: "flex", justifyContent: "center", gap: 24, flexWrap: "wrap" }}>
            {[
              { n: total, l: "pojec", e: "\uD83E\uDDE9" },
              { n: total, l: "analogii", e: "\uD83C\uDFAE" },
              { n: total, l: "zadan", e: "\uD83C\uDFAF" },
              { n: GAMES.length, l: "gier", e: "\uD83C\uDFB2" },
            ].map((s, i) => (
              <div key={i}>
                <div style={{ fontSize: 20 }}>{s.e}</div>
                <div style={{ fontSize: 22, fontWeight: 900 }}>{s.n}</div>
                <div style={{ fontSize: 10, color: "#8a8aa0" }}>{s.l}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
