  builder: { main: "var(--cyan)", dim: "var(--cyan-dim)", bright: "var(--cyan)" },
  creator: { main: "var(--amber)", dim: "var(--amber-dim)", bright: "var(--amber)" },
  developer: { main: "var(--violet)", dim: "var(--violet-dim)", bright: "var(--violet)" },

/* ─── COMPONENTS ─── */

const ModuleCard = ({ mod, isSelected, onClick, isUnlocked }) => {
  const colors = LEVEL_COLORS[mod.level];
  const level = Object.values(LEVELS).find(l => l.id === mod.level);

  return (
    <div
      onClick={onClick}
      style={{
        background: isSelected ? colors.dim : "var(--card)",
        border: `2px solid ${isSelected ? colors.main : "var(--border)"}`,
        borderRadius: 14,
        padding: "16px 18px",
        cursor: "pointer",
        transition: "all 0.25s ease",
        opacity: isUnlocked ? 1 : 0.4,
        position: "relative",
        overflow: "hidden",
      }}
    >
      {isSelected && (
        <div style={{
          position: "absolute", top: 0, left: 0, right: 0, height: 3,
          background: `linear-gradient(90deg, ${colors.main}, ${colors.bright})`,
        }} />
      )}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8 }}>
        <span style={{
          fontFamily: "'Fira Code', monospace", fontSize: 11, fontWeight: 500,
          color: colors.main, background: colors.dim,
          padding: "3px 8px", borderRadius: 6,
        }}>
          {mod.id}
        </span>
        <span style={{ fontSize: 11, color: "var(--text-dim)" }}>{mod.duration}</span>
      </div>
      <div style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>{mod.title}</div>
      <div style={{ fontSize: 12, color: "var(--text-muted)", marginBottom: 10 }}>{mod.subtitle}</div>
      <div style={{ fontSize: 12, color: "var(--text-dim)", lineHeight: 1.5 }}>
        {mod.summary.slice(0, 80)}{mod.summary.length > 80 ? "…" : ""}
      </div>
    </div>
  );
};

const DetailPanel = ({ mod, onClose }) => {

  const Section = ({ title, children }) => (

        fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: 1.5,

        {title}
      </div>
      {children}
    </div>
  );

  return (
    <div style={{
      background: "var(--card)",
      border: `1px solid var(--border)`,
      borderRadius: 16,
      padding: 28,
      position: "relative",
      overflow: "hidden",
    }}>
      <div style={{
        position: "absolute", top: 0, left: 0, right: 0, height: 4,
        background: `linear-gradient(90deg, ${colors.main}, ${colors.bright || colors.main})`,
      }} />

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 20 }}>
        <div>
          <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 6 }}>
            <span style={{
              fontFamily: "'Fira Code', monospace", fontSize: 13, fontWeight: 500,
              color: colors.main, background: colors.dim,
              padding: "4px 10px", borderRadius: 6,
            }}>
              {mod.id}
            </span>
            <span style={{
              fontSize: 11, background: colors.dim, color: colors.main,
              padding: "3px 8px", borderRadius: 6,
            }}>
              {level.icon} {level.label} ({level.age} lat)

          </div>
          <h2 style={{ fontSize: 24, fontWeight: 700, marginBottom: 4 }}>{mod.title}</h2>

        </div>
        <button

          style={{
            background: "var(--border)", border: "none", borderRadius: 8,
            width: 32, height: 32, cursor: "pointer", color: "var(--text-muted)",

          }}

      </div>

      <div style={{
        display: "flex", gap: 16, marginBottom: 22, flexWrap: "wrap",
      }}>
        {[
          { label: "Czas trwania", value: mod.duration },
          { label: "Częstotliwość", value: mod.frequency },
          { label: "Wymagania", value: mod.prereq ? `Moduł ${mod.prereq}` : "Brak" },
        ].map((item, i) => (
          <div key={i} style={{
            background: "var(--bg)", borderRadius: 10, padding: "10px 14px", flex: "1 1 120px",
          }}>
            <div style={{ fontSize: 10, color: "var(--text-dim)", textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 }}>{item.label}</div>
            <div style={{ fontSize: 14, fontWeight: 500 }}>{item.value}</div>

        {mod.summary}
      </div>

      <Section title="Umiejętności">
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {mod.skills.map((skill, i) => (
            <span key={i} style={{
              fontSize: 12, background: colors.dim, color: colors.main,
              padding: "5px 10px", borderRadius: 8,
            }}>
              {skill}
            </span>
          ))}
        </div>
      </Section>

      <Section title="Narzędzia">
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {mod.tools.map((tool, i) => (
            <span key={i} style={{
              fontSize: 12, background: "var(--bg)", color: "var(--text)",
              padding: "5px 10px", borderRadius: 8, border: "1px solid var(--border)",

        </div>

      <Section title="Projekt końcowy">
        <div style={{
          background: "var(--bg)", borderRadius: 10, padding: 14,
          borderLeft: `3px solid ${colors.main}`,
          fontSize: 13, lineHeight: 1.6, color: "var(--text)",
        }}>
          🎯 {mod.project}
        </div>
      </Section>

      <Section title="Efekty kształcenia">
        <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
          {mod.outcomes.map((outcome, i) => (
            <div key={i} style={{
              display: "flex", gap: 8, alignItems: "flex-start",
              fontSize: 13, color: "var(--text-muted)", lineHeight: 1.5,
            }}>
              <span style={{ color: colors.main, flexShrink: 0 }}>✓</span>
              {outcome}
            </div>
          ))}
        </div>
      </Section>

      {mod.unlocks.length > 0 && (
        <Section title="Odblokowuje">
          <div style={{ display: "flex", gap: 6 }}>
            {mod.unlocks.map(id => {
              const next = MODULES.find(m => m.id === id);
              return next ? (
                <span key={id} style={{
                  fontSize: 12, background: LEVEL_COLORS[next.level].dim,
                  color: LEVEL_COLORS[next.level].main,
                  padding: "5px 10px", borderRadius: 8,
                }}>
                  {id}: {next.title} →
                </span>
              ) : null;
            })}
          </div>
        </Section>
      )}
    </div>
  );

/* ─── MAIN ─── */

function CodingTreeMap() {
  const [selected, setSelected] = useState(null);
  const [viewMode, setViewMode] = useState("map"); // map | list
  const detailRef = useRef(null);

  const selectedMod = MODULES.find(m => m.id === selected);

  useEffect(() => {
    if (selectedMod && detailRef.current) {
      detailRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }, [selected]);

  const levelGroups = Object.values(LEVELS).map(level => ({
    ...level,
    modules: MODULES.filter(m => m.level === level.id),
  }));

  const totalWeeks = MODULES.reduce((sum, m) => {
    const match = m.duration.match(/(\d+)/);
    return sum + (match ? parseInt(match[1]) : 0);
  }, 0);

  return (
    <div style={{ minHeight: "100vh", background: "var(--bg)", fontFamily: "'Outfit', sans-serif", color: "var(--text)" }}>
      <style>{STYLE}</style>

      {/* Header */}
      <div style={{
        padding: "32px 24px 24px",
        borderBottom: "1px solid var(--border)",
        background: "linear-gradient(180deg, #0f1a2e 0%, var(--bg) 100%)",
      }}>
        <div style={{ maxWidth: 1100, margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 8 }}>
            <span style={{ fontSize: 32 }}>🌳</span>
            <h1 style={{ fontSize: 28, fontWeight: 800, letterSpacing: -0.5 }}>
              Coding Tree
              <span style={{ color: "var(--green)", marginLeft: 8 }}>Curriculum Map</span>
            </h1>
          </div>
          <p style={{ fontSize: 14, color: "var(--text-muted)", maxWidth: 600, lineHeight: 1.6 }}>
            Ścieżka kształcenia programistycznego dla grup 9-17 lat.
            {MODULES.length} modułów • ~{totalWeeks} tygodni łącznego programu • 4 poziomy zaawansowania
          </p>

          {/* Stats row */}
          <div style={{ display: "flex", gap: 12, marginTop: 18, flexWrap: "wrap" }}>
            {levelGroups.map(lg => (
              <div key={lg.id} style={{
                background: LEVEL_COLORS[lg.id].dim,
                borderRadius: 10, padding: "8px 14px",
                display: "flex", alignItems: "center", gap: 8,
              }}>
                <span>{lg.icon}</span>
                <span style={{ fontSize: 13, fontWeight: 600, color: LEVEL_COLORS[lg.id].main }}>
                  {lg.label}
                </span>
                <span style={{ fontSize: 11, color: "var(--text-dim)" }}>
                  {lg.age} lat • {lg.modules.length} moduły
                </span>
              </div>
            ))}
          </div>

          {/* View toggle */}
          <div style={{ display: "flex", gap: 4, marginTop: 16 }}>
            {[
              { id: "map", label: "🗺 Mapa ścieżek" },
              { id: "list", label: "📋 Lista modułów" },
            ].map(v => (
              <button
                key={v.id}
                onClick={() => setViewMode(v.id)}
                style={{
                  background: viewMode === v.id ? "var(--card)" : "transparent",
                  border: `1px solid ${viewMode === v.id ? "var(--border)" : "transparent"}`,
                  borderRadius: 8, padding: "7px 14px",
                  fontSize: 13, color: viewMode === v.id ? "var(--text)" : "var(--text-dim)",
                  cursor: "pointer", fontFamily: "'Outfit', sans-serif", fontWeight: 500,
                }}
              >
                {v.label}
              </button>
            ))}
          </div>
        </div>
      </div>

      <div style={{ maxWidth: 1100, margin: "0 auto", padding: "24px 24px 60px" }}>

        {viewMode === "map" ? (
          /* ─── MAP VIEW ─── */
          <div style={{ display: "flex", flexDirection: "column", gap: 32 }}>
            {levelGroups.map((lg, levelIdx) => (
              <div key={lg.id}>
                {/* Level header */}
                <div style={{
                  display: "flex", alignItems: "center", gap: 12, marginBottom: 16,
                  paddingBottom: 12, borderBottom: `1px solid var(--border)`,
                }}>
                  <span style={{ fontSize: 24 }}>{lg.icon}</span>
                  <div>
                    <div style={{ fontSize: 18, fontWeight: 700, color: LEVEL_COLORS[lg.id].main }}>
                      Poziom {levelIdx + 1}: {lg.label}
                    </div>
                    <div style={{ fontSize: 12, color: "var(--text-dim)" }}>
                      Wiek {lg.age} lat • {lg.modules.length} {lg.modules.length === 1 ? "moduł" : lg.modules.length < 5 ? "moduły" : "modułów"}
                    </div>
                  </div>
                </div>

                {/* Module cards grid */}
                <div style={{
                  display: "grid",
                  gridTemplateColumns: `repeat(auto-fill, minmax(260px, 1fr))`,
                  gap: 14,
                }}>
                  {lg.modules.map(mod => (
                    <ModuleCard
                      key={mod.id}
                      mod={mod}
                      isSelected={selected === mod.id}
                      isUnlocked={true}
                      onClick={() => setSelected(selected === mod.id ? null : mod.id)}
                    />
                  ))}
                </div>

                {/* Connection arrows hint */}
                {levelIdx < levelGroups.length - 1 && (
                  <div style={{
                    display: "flex", justifyContent: "center", padding: "16px 0 0",
                  }}>
                    <div style={{
                      width: 2, height: 28,
                      background: `linear-gradient(${LEVEL_COLORS[lg.id].main}, ${LEVEL_COLORS[levelGroups[levelIdx + 1].id].main})`,
                      borderRadius: 2,
                    }} />
                  </div>
                )}
              </div>
            ))}
          </div>
        ) : (
          /* ─── LIST VIEW ─── */
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            {MODULES.map((mod, i) => {
              const colors = LEVEL_COLORS[mod.level];
              const level = Object.values(LEVELS).find(l => l.id === mod.level);
              return (
                <div
                  key={mod.id}
                  onClick={() => setSelected(selected === mod.id ? null : mod.id)}
                  style={{
                    background: selected === mod.id ? colors.dim : "var(--card)",
                    border: `1px solid ${selected === mod.id ? colors.main : "var(--border)"}`,
                    borderRadius: 12, padding: "14px 18px",
                    cursor: "pointer", transition: "all 0.2s",
                    display: "flex", alignItems: "center", gap: 16,
                  }}
                >
                  <span style={{
                    fontFamily: "'Fira Code', monospace", fontSize: 13, fontWeight: 600,
                    color: colors.main, background: colors.dim,
                    padding: "4px 10px", borderRadius: 6, flexShrink: 0,
                  }}>
                    {mod.id}
                  </span>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 15, fontWeight: 600 }}>{mod.title}</div>
                    <div style={{ fontSize: 12, color: "var(--text-dim)" }}>{mod.subtitle}</div>
                  </div>
                  <div style={{ display: "flex", gap: 8, flexShrink: 0, alignItems: "center" }}>
                    <span style={{
                      fontSize: 10, background: colors.dim, color: colors.main,
                      padding: "3px 8px", borderRadius: 6,
                    }}>
                      {level.icon} {level.label}
                    </span>
                    <span style={{ fontSize: 11, color: "var(--text-dim)" }}>{mod.duration}</span>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* Detail panel */}
        {selectedMod && (
          <div ref={detailRef} style={{ marginTop: 24 }}>
            <DetailPanel mod={selectedMod} onClose={() => setSelected(null)} />
          </div>
        )}

        {/* Legend / flow */}
        <div style={{
          marginTop: 40, padding: 24,
          background: "var(--card)", borderRadius: 16, border: "1px solid var(--border)",
        }}>
          <div style={{ fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: 1.5, color: "var(--text-dim)", marginBottom: 14 }}>
            Schemat progresji
          </div>
          <div style={{ fontFamily: "'Fira Code', monospace", fontSize: 13, lineHeight: 2.2, color: "var(--text-muted)" }}>
            <span style={{ color: "var(--green)" }}>CT1</span>
            <span style={{ color: "var(--text-dim)" }}> → </span>
            <span style={{ color: "var(--green)" }}>S1</span>
            <span style={{ color: "var(--text-dim)" }}> → </span>
            <span style={{ color: "var(--green)" }}>S2</span>
            <span style={{ color: "var(--text-dim)" }}> ┬→ </span>
            <span style={{ color: "var(--cyan)" }}>PY1</span>
            <span style={{ color: "var(--text-dim)" }}> → </span>
            <span style={{ color: "var(--amber)" }}>PY2</span>
            <span style={{ color: "var(--text-dim)" }}> ┬→ </span>
            <span style={{ color: "var(--violet)" }}>PY3</span>
            <br />
            <span style={{ color: "var(--text-dim)", marginLeft: 0 }}>{"                              "}</span>
            <span style={{ color: "var(--text-dim)" }}>│{"                              "}└→ </span>
            <span style={{ color: "var(--violet)" }}>DATA1</span>
            <span style={{ color: "var(--text-dim)" }}> (opcjonalny)</span>
            <br />
            <span style={{ color: "var(--text-dim)" }}>{"                              "}└→ </span>
            <span style={{ color: "var(--cyan)" }}>WEB1</span>
            <span style={{ color: "var(--text-dim)" }}> → </span>
            <span style={{ color: "var(--amber)" }}>WEB2</span>
            <span style={{ color: "var(--text-dim)" }}> → </span>
            <span style={{ color: "var(--violet)" }}>WEB3</span>
          </div>
          <div style={{ fontSize: 12, color: "var(--text-dim)", marginTop: 12, lineHeight: 1.6 }}>
            Po module S2 (Scratch Zaawansowany) uczeń wybiera ścieżkę Python lub Web (lub obie równolegle).
            Ścieżka Python otwiera dodatkową gałąź Data & AI na poziomie Developer.
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<CodingTreeMap />);
</script>
</body>
</html>
